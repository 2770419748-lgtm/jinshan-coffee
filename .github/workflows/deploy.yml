# 把代码部署到进山服务器。先上测试版，试过没问题再上正式版：
#   main 上的服务器代码或网页后台有改动，自动部署到测试版（端口 3001，数据和正式版分开）；
#   正式版只在 Actions 里手动运行，目标选 prod。分支留空就是测试版现在跑的那个版本（试过的那个）。
# 也可以手动部署任意分支或提交到测试版。服务器那边要先做一次设置，见 deploy/README.md。
name: 部署到服务器

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'admin-web/dist/**'
  workflow_dispatch:
    inputs:
      target:
        description: '部署到哪里：test 测试版，prod 正式版'
        type: choice
        options:
          - test
          - prod
        default: test
      ref:
        description: '要部署的分支、标签或提交号。留空：测试版部署 main，正式版部署测试版现在跑的版本'
        required: false
        default: ''

permissions:
  contents: read

# 部署和运维一次只做一件事
concurrency:
  group: jinshan-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 指明 bash 才会带上 pipefail，部署失败时 | tee 后面这一步也算失败
    defaults:
      run:
        shell: bash
    steps:
      - name: 取部署脚本
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: .github

      - name: 连接服务器
        env:
          SERVER_SSH: ${{ secrets.SERVER_SSH }}
        run: bash tools/.github/scripts/server.sh setup

      - name: 定下部署哪个版本、部署到哪里
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          target="test"
          ref=$PUSH_SHA
          label=main
          if [ "$EVENT" = workflow_dispatch ]; then
            target=${INPUT_TARGET:-test}
            ref=$INPUT_REF
            label=$INPUT_REF
          fi
          # 测试版现在跑的版本：「提交号 分支」
          tested=""
          if [ "$target" = prod ]; then
            tested=$(bash tools/.github/scripts/server.sh test version 2>/dev/null | tail -n 1 || true)
            [[ ${tested%% *} =~ ^[0-9a-f]{40}$ ]] || tested=""
          fi
          if [ -z "$ref" ]; then
            if [ "$target" = test ]; then
              ref=main
              label=main
            elif [ -n "$tested" ]; then
              ref=${tested%% *}
              label=${tested#* }
              echo "部署测试版现在跑的版本：${ref:0:12}（$label）"
            else
              echo "::error::读不到测试版现在跑的版本，请在「要部署的分支」里填上要部署到正式版的提交号"
              exit 1
            fi
          fi
          case $target in test | prod) ;; *) echo "::error::目标只能是 test 或 prod"; exit 1 ;; esac
          [[ $ref =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::分支或提交号里有不该有的字符"; exit 1; }
          {
            echo "TARGET=$target"
            echo "DEPLOY_REF=$ref"
            echo "REF=$(printf '%s' "${label:-$ref}" | tr -c 'A-Za-z0-9._/-' '_' | cut -c1-100)"
            echo "TESTED_SHA=${tested%% *}"
          } >>"$GITHUB_ENV"

      - name: 取要部署的代码
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 跑测试
        working-directory: app
        run: |
          if [ ! -f server/app.js ] || [ ! -f admin-web/dist/index.html ]; then
            echo "::error::这个版本里没有 server/app.js 或 admin-web/dist，不能部署"
            exit 1
          fi
          if [ -f package.json ] && node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "没有测试，跳过"
          fi

      - name: 打包
        working-directory: app
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/bundle.tar.gz" HEAD server admin-web/dist
          sha=$(git rev-parse HEAD)
          echo "SHA=$sha" >>"$GITHUB_ENV"
          if [ "$TARGET" = prod ] && [ -n "$TESTED_SHA" ] && [ "$sha" != "$TESTED_SHA" ]; then
            echo "::warning::部署到正式版的 ${sha:0:12} 不是测试版现在跑的 ${TESTED_SHA:0:12}，没在测试版上试过"
          fi
          ls -lh "$RUNNER_TEMP/bundle.tar.gz"

      - name: 部署
        env:
          BUNDLE: ${{ runner.temp }}/bundle.tar.gz
        run: |
          if [ "$TARGET" = test ]; then name=测试版; prefix="test"; else name=正式版; prefix=""; fi
          # shellcheck disable=SC2086 # prefix 为空时不传
          bash tools/.github/scripts/server.sh $prefix deploy "$SHA" "$REF" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          {
            echo "### 部署到$name \`${SHA:0:12}\`（$REF）"
            echo '```'
            cat "$RUNNER_TEMP/deploy.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
